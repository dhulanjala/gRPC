// ---------------------------------------------------------------------------
// The CONTRACT. Both services compile/load this same file.
// It is the single source of truth for messages and RPC methods.
// ---------------------------------------------------------------------------
syntax = "proto3";

package inventory;

// A service is a named group of RPC methods.
service Inventory {
  // 1. UNARY: one request  -> one response  (like a normal function call)
  rpc GetProduct (GetProductRequest) returns (Product);

  // 2. SERVER STREAMING: one request -> stream of responses
  rpc ListProducts (ListProductsRequest) returns (stream Product);

  // 3. CLIENT STREAMING: stream of requests -> one response
  rpc RecordSales (stream SaleItem) returns (SalesSummary);

  // 4. BIDIRECTIONAL STREAMING: stream <-> stream, independently
  rpc WatchStock (stream StockQuery) returns (stream StockUpdate);
}

// --------------------------- messages --------------------------------------
// The numbers (= 1, = 2) are FIELD TAGS. They are what actually goes on the
// wire, not the field names. Never reuse or change a tag once released.

message GetProductRequest {
  string id = 1;
}

message Product {
  string id       = 9;
  string name     = 2;
  double price    = 3;   // in USD
  int32  stock    = 4;
  Category category = 5;
}

message ListProductsRequest {
  Category category = 1;  // UNSPECIFIED (0) means "all categories"
  int32 min_stock   = 2;
}

message SaleItem {
  string product_id = 1;
  int32  quantity   = 2;
}

message SalesSummary {
  int32  items_sold      = 1;
  int32  line_count      = 2;
  double total_amount    = 3;
  repeated string failed = 4;  // ids we could not fulfil
}

message StockQuery {
  string product_id = 1;
}

message StockUpdate {
  string product_id = 1;
  string name       = 2;
  int32  stock      = 3;
  string observed_at = 4;  // ISO timestamp
}

// proto3 enums MUST have a zero value, and it is the default.
enum Category {
  CATEGORY_UNSPECIFIED = 0;
  COMPUTING            = 1;
  ACCESSORY            = 2;
  AUDIO                = 3;
}
